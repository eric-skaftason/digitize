<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitize</title>

    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <h1>Digitize</h1>

    <div class="demo_container">
        <div class="demo_wrapper">
            <div class="canvas_container">
                <canvas class="canvas" id="main_canvas"></canvas>
                <!-- <canvas class="canvas" id="debug_canvas"></canvas> -->
            </div>
            <div class="message">
                <p class="message_line text_line text_line_heading"></p>
                <p class="message_line text_line"></p>
                <p class="message_line digit_line" id="digit_line"></p>

                <div id="close_message">x</div>
            </div>

            <div class="menu">
                <button class="menu_btn" id="predict">Predict!</button>
            </div>
             
            <div class="menu">
                <button class="menu_btn" id="clear">Clear</button>
                <button class="menu_btn" id="predict_centroid">Centroid</button>
                <button class="menu_btn" id="predict_knn">k-NN</button>
                <button class="menu_btn" id="redraw">Redraw</button>
                <button class="menu_btn" id="debug28">Debug28</button>
            </div>
            <div class="menu">
                <button class="menu_btn" id="rand_centroid">Random (Centroid)</button>
                <button class="menu_btn" id="rand_knn">Random (k-NN)</button>
                <button class="menu_btn" id="draw_rand">Draw Random</button>
            </div>
            <div class="menu">
                <button class="menu_btn" id="test_centroid500">500 Centroid</button>
                <button class="menu_btn" id="test_knn100_draw">100 Draw k-NN</button>
                <button class="menu_btn" id="test_knn500">500 k-NN</button>
            </div>
            
        </div>
    </div>
    
    <script src="./js/canvas.js" type="module"></script>
    <script src="./js/canvasInput.js" type="module"></script>
    <script src="./js/message.js" type="module"></script>
    <script src="./js/classifier.js" type="module"></script>
    <script src="./js/helper.js" type="module"></script>

    <script src="./js/utils.js" type="module"></script>
    <script src="./js/tests.js" type="module"></script>

</body>
</html>
