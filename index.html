    <h1>Digitize</h1>

    <div class="demo_container">
        <div class="menu">
            <button class="menu_btn" id="clear">Clear</button>
            <button class="menu_btn square" id="settings">
                <img src="./assets/settings.svg" alt="⚙">
            </button>
        </div>

        <div class="demo_wrapper">
            <div class="canvas_container">
                <canvas class="canvas" id="main_canvas"></canvas>
                <!-- <canvas class="canvas" id="debug_canvas"></canvas> -->
            </div>
            <div class="message">
                <p class="message_line text_line text_line_heading"></p>
                <p class="message_line text_line"></p>
                <p class="message_line digit_line" id="digit_line"></p>

                <div id="close_message">
                    <img src="./assets/close.svg" alt="x">
                </div>
            </div>
            
        </div>


        <div class="menu">
            <button class="menu_btn" id="predict">Predict!</button>
        </div>

    </div>

    <div class="modal_settings">
        <div id="close_settings_menu_top_right">
            <img src="./assets/close.svg" alt="x">
        </div>

        <div class="settings_menu">
            <h2>Settings</h2>

            <div class="options">

                <div class="option">
                    <div class="toggle" id="show_debug_options"><div class="toggle_indicator"></div></div>
                    <p class="desc">Show Debug Options</p>
                </div>
                <div class="option">
                    <div class="toggle enabled"><div class="toggle_indicator"></div></div>
                    <p class="desc">Show Debug Options</p>
                </div>
            </div>

            <div class="menu_footer">
                <button class="settings_menu_btn" id="close_settings_menu">Close</button>
                <button class="settings_menu_btn" id="save_settings">Save</button>
                <button class="settings_menu_btn" id="save_settings_close_menu">Save & Close</button>
            </div>
        </div>
    </div>
